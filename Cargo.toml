[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/strategies",
    "crates/exchange",
    "crates/ml-trader",
    "crates/mcp-server",
    "crates/backtester",
    "crates/dashboard",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
version = "0.1.0"
license = "MIT OR Apache-2.0"
authors = ["Bezoom"]
repository = "https://github.com/Bezooom/Torgarik"
readme = "README.md"
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full", "rt-multi-thread", "macros", "time", "sync"] }

# HTTP & serialization
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging & tracing
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# Crypto
ethers = { version = "2.0", features = ["abigen", "rustls", "ws"] }
secp256k1 = { version = "0.27", features = ["rand", "global-context", "bitcoin_hashes"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
sha3 = "0.10"
regex = "1.10"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "v7", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
config = "0.14"
async-trait = "0.1"
futures = { version = "0.3", features = ["std"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# Metrics
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Hex encoding
hex = "0.4"

# MessagePack (Hyperliquid L1 action hashing)
rmp = "0.8"
rmpv = "1.3"

# TOML parsing
toml = "0.8"

# Common
trading-common = { path = "crates/common", package = "trading-common" }
common = { path = "crates/common", package = "trading-common" }
trading-strategies = { path = "crates/strategies", package = "trading-strategies" }
strategies = { path = "crates/strategies", package = "trading-strategies" }
trading-exchange = { path = "crates/exchange", package = "trading-exchange" }
exchange = { path = "crates/exchange", package = "trading-exchange" }
ml-trader = { path = "crates/ml-trader", package = "ml-trader" }
