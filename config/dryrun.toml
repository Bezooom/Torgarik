# Paper – majors_alpha: next-bar EMA + vol regime + funding veto
# Universe: ETH + SOL only
mode = "dry_run"
log_level = "info"
metrics_port = 9090

[exchange]
primary_venue = "hyperliquid"
hyperliquid_base_url = "https://api.hyperliquid.xyz"
hyperliquid_ws_url = "wss://api.hyperliquid.xyz/ws"
symbol_whitelist = ["ETH", "SOL"]
allow_synthetic = false
wallet_address = ""
rpc_url = "https://rpc.hyperliquid.xyz/evm"
chain_id = 42161
max_gas_price_gwei = 50
max_slippage = 0.01

[risk]
max_portfolio_exposure = 0.20
max_position_per_instrument = 0.10
max_daily_loss = 0.02
stop_loss = 0.06
use_exchange_balance = true
starting_bankroll = 1000.0

[strategy]
name = "majors_alpha"
funding_enter = 0.00003
funding_exit = 0.000010
kelly_fraction = 0.2
min_edge = 0.0
loop_interval_secs = 12

universe_mode = "allowlist"
blacklist = [
  "ACE", "NOT", "MOVE", "kNEIRO", "NEIRO", "SUPER", "CASHCAT", "POPCAT",
  "WIF", "MEW", "PNUT", "GOAT", "MOODENG", "FARTCOIN", "BRETT", "GIGA",
  "BONK", "FLOKI", "BOME", "DOGS", "HMSTR", "MEME", "TURBO", "BTC",
]
min_oi_notional_usd = 5000000.0
min_mid = 0.05
max_abs_funding = 0.0005
max_positions = 2
top_n = 2

# 1h EMA + regime
# most common train pick under realistic OOS
ema_fast = 5
ema_slow = 34
funding_veto = 0.00015
min_trend_strength = 0.0008
vol_lookback = 24
min_vol_ratio = 0.0025

[ml]
enabled = false
model_path = "models/market_predictor.onnx"
consensus_threshold = 0.65
n_estimators = 200
llm_endpoint = "https://openrouter.ai/api/v1"
llm_api_key = ""
sglang_endpoint = "http://localhost:30000/v1"
sglang_model = "default"
use_local_sglang = false

# OOS kill-switch floors (explicit = defaults). Paper/dry-run still advisory-only.
[oos]
sharpe_floor = 0.0
avg_pnl_floor = 0.0
min_profitable_fold_ratio = 0.0

[risk.protections]
stoploss_guard_max_stops = 2
stoploss_guard_window_hours = 48.0
cooldown_hours = 4.0
max_drawdown_frac = 0.10
